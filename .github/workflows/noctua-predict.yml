# NOCTUA hourly forecast + R2 data export.
name: noctua-predict

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: noctua-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: model/serve/requirements-ci.txt

      - name: Install NOCTUA runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Bootstrap history bundle (hanya jika belum ada)
        run: |
          if [ ! -f data/noctua_history.parquet ]; then
            python model/serve/bootstrap_bundle.py
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/noctua_history.parquet
            git diff --cached --quiet && exit 1
            git commit -m "chore: bootstrap noctua history bundle via CI [skip ci]"
            git push
          fi

      - name: Run NOCTUA forecast + build current data export
        run: python model/serve/predict.py --out-dir /tmp/noctua_out

      - name: Upload current NOCTUA data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          test -s /tmp/noctua_out/noctua_history.parquet
          test -s /tmp/noctua_out/noctua_history.csv

          pnpm dlx wrangler@3.80.0 r2 object put noctua-data/exports/noctua_history.parquet             --file=/tmp/noctua_out/noctua_history.parquet             --content-type=application/octet-stream             --content-disposition='attachment; filename="noctua_history.parquet"'             --remote --force

          pnpm dlx wrangler@3.80.0 r2 object put noctua-data/exports/noctua_history.csv             --file=/tmp/noctua_out/noctua_history.csv             --content-type='text/csv; charset=utf-8'             --content-disposition='attachment; filename="noctua_history.csv"'             --remote --force

      - name: Commit bundle history jika berubah
        run: |
          set -e
          if [ -n "$(git status --porcelain -- data/noctua_history.parquet)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/noctua_history.parquet
            git commit -m "chore: refresh noctua history bundle via CI [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Push prediction ke Cloudflare Worker KV
        env:
          NOCTUA_WORKER_URL: ${{ secrets.NOCTUA_WORKER_URL }}
          NOCTUA_PUSH_SECRET: ${{ secrets.NOCTUA_PUSH_SECRET }}
        run: |
          set -e
          if [ -z "${NOCTUA_WORKER_URL}" ]; then
            echo "[CI] WARNING: NOCTUA_WORKER_URL belum diset -- skip push."
            exit 0
          fi
          NOCTUA_FILE="/tmp/noctua_out/noctua.json"
          BGTC_FILE="/tmp/noctua_out/BGTC.json"
          PAYLOAD="/tmp/noctua_payload.json"
          if [ -f "$NOCTUA_FILE" ] && [ -f "$BGTC_FILE" ]; then
            python model/serve/merge_payload.py "$NOCTUA_FILE" "$BGTC_FILE" "$PAYLOAD"
          elif [ -f "$NOCTUA_FILE" ]; then
            cp "$NOCTUA_FILE" "$PAYLOAD"
          elif [ -f "$BGTC_FILE" ]; then
            cp "$BGTC_FILE" "$PAYLOAD"
          else
            echo "No prediction output found -- skipping push"
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /tmp/push_response.txt -w "%{http_code}"             -X POST "${NOCTUA_WORKER_URL}/api/noctua/push"             -H "Content-Type: application/json"             -H "Authorization: Bearer ${NOCTUA_PUSH_SECRET}"             --data-binary @"$PAYLOAD")
          cat /tmp/push_response.txt
          test "$HTTP_STATUS" = "200"
