# .github/workflows/noctua-predict.yml
# =====================================================================
# Jalankan NOCTUA Python model (predict.py) setiap 30 menit.
# Hasilnya di-push ke Cloudflare Worker KV via POST /api/noctua/push
# -- bukan commit ke repo lagi.
#
# Jika data/noctua_history.parquet belum ada, workflow akan mem-build
# bundle dari Bitstamp API (~400 hari) dan commit ke repo secara otomatis.
# Run berikutnya hanya fetch tail (cepat, 1 request).
#
# Secrets yang dibutuhkan di repo settings:
#   NOCTUA_WORKER_URL   -- misal: https://btc-dashboard-worker-production.xxx.workers.dev
#   NOCTUA_PUSH_SECRET  -- sama dengan wrangler secret NOCTUA_PUSH_SECRET di Worker

name: noctua-predict

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: noctua-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NOCTUA runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Bootstrap history bundle (hanya jika belum ada)
        run: |
          if [ ! -f data/noctua_history.parquet ]; then
            echo "[CI] Bundle belum ada, menjalankan bootstrap..."
            python model/serve/bootstrap_bundle.py
            echo "[CI] Bootstrap selesai. Commit bundle ke repo..."
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/noctua_history.parquet
            # Cek apakah ada yang perlu di-commit (jika file masih di-ignore, staged akan kosong)
            if git diff --cached --quiet; then
              echo "[CI] ERROR: git add tidak meng-stage file apapun."
              echo "[CI] Periksa .gitignore -- data/noctua_history.parquet mungkin masih diabaikan."
              git status
              git check-ignore -v data/noctua_history.parquet || true
              exit 1
            fi
            git commit -m "chore: bootstrap noctua history bundle via CI [skip ci]"
            git push
            echo "[CI] Bundle berhasil di-commit."
          else
            echo "[CI] Bundle sudah ada, skip bootstrap."
          fi

      - name: Run NOCTUA forecast
        run: python model/serve/predict.py --out-dir /tmp/noctua_out

      - name: Push hasil ke Cloudflare Worker KV
        env:
          NOCTUA_WORKER_URL: ${{ secrets.NOCTUA_WORKER_URL }}
          NOCTUA_PUSH_SECRET: ${{ secrets.NOCTUA_PUSH_SECRET }}
        run: |
          set -e

          # Jika secret belum diset, skip push dengan warning (bukan error)
          if [ -z "${NOCTUA_WORKER_URL}" ]; then
            echo "[CI] WARNING: NOCTUA_WORKER_URL secret belum diset -- skip push ke Worker."
            echo "[CI] Set secret di: Settings > Secrets and variables > Actions"
            exit 0
          fi

          NOCTUA_FILE="/tmp/noctua_out/noctua.json"
          KRONOS_FILE="/tmp/noctua_out/kronos.json"

          if [ -f "$NOCTUA_FILE" ] && [ -f "$KRONOS_FILE" ]; then
            PAYLOAD=$(python3 - <<'PYEOF'
import json
n = json.load(open("/tmp/noctua_out/noctua.json"))
k = json.load(open("/tmp/noctua_out/kronos.json"))
merged = {**k, **n, "_source": "gh-actions-noctua"}
print(json.dumps(merged))
PYEOF
)
          elif [ -f "$NOCTUA_FILE" ]; then
            PAYLOAD=$(cat "$NOCTUA_FILE")
          elif [ -f "$KRONOS_FILE" ]; then
            PAYLOAD=$(cat "$KRONOS_FILE")
          else
            echo "No prediction output found -- skipping push"
            exit 0
          fi

          echo "Pushing prediction to Worker..."
          HTTP_STATUS=$(curl -s -o /tmp/push_response.txt -w "%{http_code}" \
            -X POST "${NOCTUA_WORKER_URL}/api/noctua/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${NOCTUA_PUSH_SECRET}" \
            -d "$PAYLOAD")

          cat /tmp/push_response.txt
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Push failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Push OK -- prediction live in KV"
