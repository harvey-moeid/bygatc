# .github/workflows/noctua-predict.yml
# =====================================================================
# Jalankan NOCTUA Python model (predict.py) setiap 60 menit (per jam).
# Hasilnya di-push ke Cloudflare Worker KV via POST /api/noctua/push
#
# Secrets yang dibutuhkan di repo settings:
#   NOCTUA_WORKER_URL   -- misal: https://btc-dashboard-worker-production.xxx.workers.dev
#   NOCTUA_PUSH_SECRET  -- sama dengan wrangler secret NOCTUA_PUSH_SECRET di Worker
#
# Catatan bundle history:
#   serve/history.py::get_hours() menulis ulang data/noctua_history.parquet
#   di disk kira-kira sekali seminggu (PERSIST_AFTER_HOURS) supaya live-fetch
#   tail-nya tidak terus membengkak. Perubahan itu HARUS di-commit balik ke
#   repo di sini (step "Commit bundle history jika berubah") -- kalau tidak,
#   bundle yang ter-commit beku di kondisi bootstrap dan cron ini akan mulai
#   gagal terus-menerus begitu gap-nya melebihi batas tail-fetch (~30 hari).
#
# Catatan anggaran menit CI:
#   Cron diturunkan dari tiap 30 menit ke tiap 60 menit (24 run/hari, ~720
#   run/bulan) untuk menekan pemakaian menit Actions di repo private.
#   Step install juga pakai cache pip supaya numpy/scipy/pandas/pyarrow
#   tidak di-download & di-build ulang dari nol di setiap run.

name: noctua-predict

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: noctua-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: model/serve/requirements-ci.txt

      - name: Install NOCTUA runtime
        run: pip install --quiet -r model/serve/requirements-ci.txt

      - name: Bootstrap history bundle (hanya jika belum ada)
        run: |
          if [ ! -f data/noctua_history.parquet ]; then
            echo "[CI] Bundle belum ada, menjalankan bootstrap..."
            python model/serve/bootstrap_bundle.py
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/noctua_history.parquet
            if git diff --cached --quiet; then
              echo "[CI] ERROR: git add tidak meng-stage file apapun."
              git status
              git check-ignore -v data/noctua_history.parquet || true
              exit 1
            fi
            git commit -m "chore: bootstrap noctua history bundle via CI [skip ci]"
            git push
            echo "[CI] Bundle berhasil di-commit."
          else
            echo "[CI] Bundle sudah ada, skip bootstrap."
          fi

      - name: Run NOCTUA forecast
        run: python model/serve/predict.py --out-dir /tmp/noctua_out

      - name: Commit bundle history jika berubah
        run: |
          set -e
          # get_hours() menulis ulang data/noctua_history.parquet di disk saat
          # gap sejak commit terakhir >= PERSIST_AFTER_HOURS (lihat header file
          # ini). Cek langsung ke git status -- tidak bergantung pada bookkeeping
          # internal Python -- supaya kejadian ini tetap ke-commit walau logika
          # di history.py berubah nanti.
          if [ -n "$(git status --porcelain -- data/noctua_history.parquet)" ]; then
            echo "[CI] Bundle history ditulis ulang oleh run ini -- commit & push."
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/noctua_history.parquet
            git commit -m "chore: refresh noctua history bundle via CI [skip ci]"
            git pull --rebase origin main
            git push
            echo "[CI] Bundle history berhasil di-refresh."
          else
            echo "[CI] Bundle history tidak berubah pada run ini -- tidak ada yang di-commit."
          fi

      - name: Push hasil ke Cloudflare Worker KV
        env:
          NOCTUA_WORKER_URL: ${{ secrets.NOCTUA_WORKER_URL }}
          NOCTUA_PUSH_SECRET: ${{ secrets.NOCTUA_PUSH_SECRET }}
        run: |
          set -e

          if [ -z "${NOCTUA_WORKER_URL}" ]; then
            echo "[CI] WARNING: NOCTUA_WORKER_URL secret belum diset -- skip push."
            exit 0
          fi

          NOCTUA_FILE="/tmp/noctua_out/noctua.json"
          BGTC_FILE="/tmp/noctua_out/BGTC.json"
          PAYLOAD="/tmp/noctua_payload.json"

          if [ -f "$NOCTUA_FILE" ] && [ -f "$BGTC_FILE" ]; then
            python model/serve/merge_payload.py "$NOCTUA_FILE" "$BGTC_FILE" "$PAYLOAD"
          elif [ -f "$NOCTUA_FILE" ]; then
            cp "$NOCTUA_FILE" "$PAYLOAD"
          elif [ -f "$BGTC_FILE" ]; then
            cp "$BGTC_FILE" "$PAYLOAD"
          else
            echo "No prediction output found -- skipping push"
            exit 0
          fi

          echo "Pushing prediction to Worker..."
          HTTP_STATUS=$(curl -s -o /tmp/push_response.txt -w "%{http_code}" \
            -X POST "${NOCTUA_WORKER_URL}/api/noctua/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${NOCTUA_PUSH_SECRET}" \
            --data-binary @"$PAYLOAD")

          cat /tmp/push_response.txt
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Push failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Push OK -- prediction live in KV"
