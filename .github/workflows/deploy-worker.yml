# .github/workflows/deploy-worker.yml
# =====================================================================
# Deploy Cloudflare Worker secara otomatis saat push ke branch main.
#
# Secrets yang dibutuhkan:
#   CLOUDFLARE_API_TOKEN  -- API token dengan scope Workers:Edit + KV:Edit
#   CLOUDFLARE_ACCOUNT_ID -- Account ID dari dashboard Cloudflare
#
# Catatan: hanya ada satu environment (production) -- lihat wrangler.toml.
# `pnpm deploy:production` sekarang memanggil `wrangler deploy` polos (tanpa
# --env), karena wrangler.toml tidak lagi punya environment bernama.

name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/frontend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

# Jangan biarkan beberapa manual deploy menimpa satu sama lain.
concurrency:
  group: deploy-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Secrets tidak boleh dipakai langsung di `if:`. Expose lewat job env
      # lalu gunakan env context untuk mengecek apakah nilainya tersedia.
      NOCTUA_PUSH_SECRET: ${{ secrets.NOCTUA_PUSH_SECRET }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Encoding regression guard
        run: node scripts/check-encoding.js

      - name: Typecheck Worker
        working-directory: apps/worker
        run: pnpm typecheck

      - name: Deploy Worker to production
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:production

      # Manual dispatch dipakai untuk deploy/recovery. Sebelumnya step ini
      # selalu mencoba `wrangler secret put` walaupun NOCTUA_PUSH_SECRET belum
      # dibuat di GitHub Secrets. `echo "" | wrangler secret put ...` dapat
      # membuat step gagal setelah Worker sebenarnya sudah berhasil deploy.
      # Sekarang secret hanya disinkronkan jika nilainya memang tersedia.
      - name: Sync NOCTUA_PUSH_SECRET to Worker
        if: ${{ github.event_name == 'workflow_dispatch' && env.NOCTUA_PUSH_SECRET != '' }}
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$NOCTUA_PUSH_SECRET" | pnpm wrangler secret put NOCTUA_PUSH_SECRET

      - name: Sync optional EXA_API_KEY to Worker
        if: ${{ github.event_name == 'workflow_dispatch' && env.EXA_API_KEY != '' }}
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$EXA_API_KEY" | pnpm wrangler secret put EXA_API_KEY

      - name: Report missing optional deploy secrets
        if: ${{ github.event_name == 'workflow_dispatch' && (env.NOCTUA_PUSH_SECRET == '' || env.EXA_API_KEY == '') }}
        run: |
          if [ -z "$NOCTUA_PUSH_SECRET" ]; then
            echo "::warning::NOCTUA_PUSH_SECRET is not configured in GitHub Secrets; existing Cloudflare secret was left unchanged."
          fi
          if [ -z "$EXA_API_KEY" ]; then
            echo "::notice::EXA_API_KEY is not configured in GitHub Secrets; existing Cloudflare secret was left unchanged."
          fi
