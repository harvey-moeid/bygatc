name: diagnose-deploy

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOCTUA_PUSH_SECRET: ${{ secrets.NOCTUA_PUSH_SECRET }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
          code=${PIPESTATUS[0]}
          {
            echo '=== INSTALL ==='
            cat /tmp/install.log
            echo "INSTALL_EXIT=$code"
          } > diagnostics-deploy.txt
          exit $code

      - name: Encoding guard
        id: encoding
        continue-on-error: true
        run: |
          set +e
          node scripts/check-encoding.js 2>&1 | tee /tmp/encoding.log
          code=${PIPESTATUS[0]}
          {
            echo
            echo '=== ENCODING ==='
            cat /tmp/encoding.log
            echo "ENCODING_EXIT=$code"
          } >> diagnostics-deploy.txt
          exit $code

      - name: Typecheck Worker
        id: typecheck
        continue-on-error: true
        working-directory: apps/worker
        run: |
          set +e
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          {
            echo
            echo '=== TYPECHECK ==='
            cat /tmp/typecheck.log
            echo "TYPECHECK_EXIT=$code"
          } >> ../../diagnostics-deploy.txt
          exit $code

      - name: Wrangler dry run
        id: dryrun
        continue-on-error: true
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          pnpm wrangler deploy --dry-run 2>&1 | tee /tmp/dryrun.log
          code=${PIPESTATUS[0]}
          {
            echo
            echo '=== WRANGLER DRY RUN ==='
            cat /tmp/dryrun.log
            echo "DRYRUN_EXIT=$code"
          } >> ../../diagnostics-deploy.txt
          exit $code

      - name: Secret availability summary
        run: |
          {
            echo
            echo '=== SECRET AVAILABILITY ==='
            if [ -n "$NOCTUA_PUSH_SECRET" ]; then echo 'NOCTUA_PUSH_SECRET=present'; else echo 'NOCTUA_PUSH_SECRET=missing'; fi
            if [ -n "$EXA_API_KEY" ]; then echo 'EXA_API_KEY=present'; else echo 'EXA_API_KEY=missing'; fi
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN=present'; else echo 'CLOUDFLARE_API_TOKEN=missing'; fi
            if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'CLOUDFLARE_ACCOUNT_ID=present'; else echo 'CLOUDFLARE_ACCOUNT_ID=missing'; fi
          } >> diagnostics-deploy.txt

      - name: Publish diagnostic result
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics-deploy.txt
          git commit -m 'chore: update deploy diagnostics' || exit 0
          git push
