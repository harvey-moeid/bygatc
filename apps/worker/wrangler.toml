name = "btc-dashboard-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# — Cron Triggers ———————————————————————————————————————————————————————————————————————————————————
# Setiap jam: fetch news + fear & greed → simpan ke KV
[triggers]
crons = ["0 * * * *"]

# — KV (dev lokal — pakai preview) ——————————————————————————————————————————————————————————————————————————
[[kv_namespaces]]
binding = "BTC_CACHE"
id = "ed38018b3b2e4f6e832ddc996d256cc9"
preview_id = "ed38018b3b2e4f6e832ddc996d256cc9"

[[d1_databases]]
binding = "BITBOT_DB"
database_name = "bitbot"
database_id = "a7f0c4f1-c1c3-4b8e-994a-2f7dbaf7c51a"

# — Staging ————————————————————————————————————————————————————————————————————————————————————
[env.staging]
name = "btc-dashboard-worker-staging"

[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.kv_namespaces]]
binding = "BTC_CACHE"
id = "ed38018b3b2e4f6e832ddc996d256cc9"

[[env.staging.d1_databases]]
binding = "BITBOT_DB"
database_name = "bitbot"
database_id = "a7f0c4f1-c1c3-4b8e-994a-2f7dbaf7c51a"

# — Production ——————————————————————————————————————————————————————————————————————————————————————
[env.production]
name = "btc-dashboard-worker-production"

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.kv_namespaces]]
binding = "BTC_CACHE"
id = "ed38018b3b2e4f6e832ddc996d256cc9"

[[env.production.d1_databases]]
binding = "BITBOT_DB"
database_name = "bitbot"
database_id = "a7f0c4f1-c1c3-4b8e-994a-2f7dbaf7c51a"
